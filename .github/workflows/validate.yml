name: Portfolio validation
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main, redesign/ai-native-personal-portfolio]

concurrency:
  group: portfolio-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Lint, builds, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test Go backend
        run: go test ./...
        working-directory: backend
      - name: Validate and build the portfolio
        run: pnpm install --frozen-lockfile && pnpm lint && pnpm build && pnpm exec tsc --noEmit
        working-directory: frontend
      - name: Validate and build the admin app
        run: pnpm install --frozen-lockfile && pnpm lint && pnpm build && pnpm exec tsc --noEmit
        working-directory: admin
      - name: Test circuit models
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/circuit-models.mjs
      - name: Run project and contact integration smoke tests
        run: bash tests/run-smoke.sh
